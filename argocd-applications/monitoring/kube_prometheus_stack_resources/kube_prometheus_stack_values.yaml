defaultRules:
  rules:
    etcd: false
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false

prometheus-windows-exporter:
  prometheus:
    monitor:
      enabled: false
alertmanager:
  config:
    global:
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'youremailaddress@gmail.com'
      smtp_auth_username: 'youremailaddress@gmail.com'
      smtp_auth_password_file: '/etc/custom_secrets/.smtp_app_password'
      smtp_require_tls: true

    route:
      routes:
      - receiver: 'null'
        matchers:
          - alertname = "Watchdog"

      - receiver: 'gmail-notifications'
        matchers:
          - alertname != "Watchdog"

    receivers:
    - name: 'null'
    - name: 'gmail-notifications'
      email_configs:
        - to: 'someemailaddress@gmail.com'
          headers:
            Subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
          html: |
            <b>Alert:</b> {{ .GroupLabels.alertname }}<br>
            <b>Status:</b> {{ .Status }}<br>
            {{ range .Alerts }}
            <b>Summary:</b> {{ .Annotations.summary }}<br>
            <b>Description:</b> {{ .Annotations.description }}<br>
            {{ end }}

  ingress:
    enabled: true

    ingressClassName: "traefik"

    annotations:
      cert-manager.io/cluster-issuer: letsencrypt

    hosts:
      - alertmanager.dani-porto.com

    tls:
      - hosts:
        - alertmanager.dani-porto.com
        secretName: alertmanager-cert

  serviceMonitor:
    interval: "60s"

  alertmanagerSpec:

    volumes:
      - name: smtp-password
        secret:
          secretName: smtp-public-gmail-app-password

    volumeMounts:
      - name: smtp-password
        readOnly: true
        mountPath: "/etc/custom_secrets"

grafana:

  defaultDashboardsEnabled: false

  admin:
    existingSecret: "grafana-admin-credentials"

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.dani-porto.com

  persistence:
    enabled: true
    type: pvc
    existingClaim: grafana-pvc

  sidecar:
    dashboards:
      enabled: false

    datasources:
      enabled: false

      url: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090/

      prometheusServiceName: monitoring-kube-prometheus-prometheus

      alertmanager:
        enabled: false

  serviceMonitor:
    enabled: false

kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

nodeExporter:
    aix:
      enabled: false
    darwin:
      enabled: false

prometheusOperator:

  kubeletEndpointsEnabled: false
  kubeletEndpointSliceEnabled: true
prometheus:
  ingress:
    enabled: true

    ingressClassName: "traefik"

    annotations:
      cert-manager.io/cluster-issuer: letsencrypt

    hosts:
      - prometheus.dani-porto.com

    tls:
      - hosts:
        - prometheus.dani-porto.com
        secretName: prometheus-cert

  prometheusSpec:
    scrapeInterval: "60s"

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    retention: 90d
    retentionSize: "50GiB"

    storageSpec:
    ## Using PersistentVolumeClaim
      volumeClaimTemplate:
        spec:
          volumeName: prometheus-pv
          selector: {}
          storageClassName: ""
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi